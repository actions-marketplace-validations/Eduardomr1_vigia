name: 'Vigía - Assertion Guard'
description: 'Flags tests that pass without verifying anything, comments on Pull Requests, and publishes SARIF to GitHub Code Scanning.'
author: 'Eduardo Maytorena'

branding:
  icon: 'eye'
  color: 'blue'

inputs:
  path:
    description: 'Directory to analyze when not limited to the files changed in the PR.'
    required: false
    default: '.'
  changed-only:
    description: 'Only analyze the test files touched by the PR.'
    required: false
    default: 'true'
  source:
    description: 'Root of the source code. Enables detection of orphan negative assertions.'
    required: false
    default: ''
  fail-on-p1:
    description: 'Fail the job when there are P1 findings.'
    required: false
    default: 'true'
  comment:
    description: 'Post the result as a comment on the PR.'
    required: false
    default: 'true'
  sarif:
    description: 'Generate SARIF report for GitHub Code Scanning.'
    required: false
    default: 'true'
  sarif-file:
    description: 'Output path for the generated SARIF report.'
    required: false
    default: 'vigia-results.sarif'
  upload-sarif:
    description: 'Upload SARIF report to GitHub Code Scanning via @github/codeql-action/upload-sarif.'
    required: false
    default: 'true'
  category:
    description: 'Category name for GitHub Code Scanning.'
    required: false
    default: 'vigia'

outputs:
  findings:
    description: 'Total number of findings.'
    value: ${{ steps.analyze.outputs.findings }}
  p1:
    description: 'Number of P1 findings.'
    value: ${{ steps.analyze.outputs.p1 }}
  sarif-file:
    description: 'Path to the generated SARIF report.'
    value: ${{ inputs.sarif-file }}

runs:
  using: 'composite'
  steps:
    # dist/ isn't versioned: it's a build artifact. The action compiles it the
    # first time it's used, inside its own directory, without touching the
    # calling repo. Costs a few seconds and avoids committing generated code.
    - name: Prepare Vigía
      shell: bash
      run: |
        if [ ! -f "${{ github.action_path }}/dist/cli.js" ]; then
          cd "${{ github.action_path }}"
          npm ci --ignore-scripts
          npm run build
        fi

    - name: Determine files to analyze
      id: files
      shell: bash
      run: |
        if [ "${{ inputs.changed-only }}" = "true" ] && [ -n "$GITHUB_BASE_REF" ]; then
          git fetch --depth=1 origin "$GITHUB_BASE_REF"
          CHANGED=$(git diff --name-only --diff-filter=d "origin/$GITHUB_BASE_REF"...HEAD | grep -E '\.(test|spec)\.(ts|tsx|js|jsx)$|\.ya?ml$' || true)
          echo "list<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGED" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
        else
          echo "list=" >> "$GITHUB_OUTPUT"
        fi

    - name: Analyze
      id: analyze
      shell: bash
      run: |
        LIST="${{ steps.files.outputs.list }}"
        SRC=""
        if [ -n "${{ inputs.source }}" ]; then SRC="--src ${{ inputs.source }}"; fi

        if [ -n "$LIST" ]; then
          node "${{ github.action_path }}/dist/cli.js" --format markdown $SRC --files $LIST > vigia-report.md || true
          if [ "${{ inputs.sarif }}" = "true" ]; then
            node "${{ github.action_path }}/dist/cli.js" --format sarif -o "${{ inputs.sarif-file }}" $SRC --files $LIST || true
          fi
        else
          node "${{ github.action_path }}/dist/cli.js" "${{ inputs.path }}" $SRC --format markdown > vigia-report.md || true
          if [ "${{ inputs.sarif }}" = "true" ]; then
            node "${{ github.action_path }}/dist/cli.js" "${{ inputs.path }}" $SRC --format sarif -o "${{ inputs.sarif-file }}" || true
          fi
        fi

        cat vigia-report.md

        if [ "${{ inputs.sarif }}" = "true" ] && [ -f "${{ inputs.sarif-file }}" ]; then
          node -e "
            const fs = require('fs');
            try {
              const data = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'));
              const results = data.runs?.[0]?.results || [];
              const p1 = results.filter(r => r.level === 'error').length;
              fs.appendFileSync(process.env.GITHUB_OUTPUT, 'findings=' + results.length + '\n');
              fs.appendFileSync(process.env.GITHUB_OUTPUT, 'p1=' + p1 + '\n');
            } catch (err) {
              fs.appendFileSync(process.env.GITHUB_OUTPUT, 'findings=0\np1=0\n');
            }
          " "${{ inputs.sarif-file }}"
        else
          echo "findings=0" >> "$GITHUB_OUTPUT"
          echo "p1=0" >> "$GITHUB_OUTPUT"
        fi

    - name: Comment on the PR
      if: inputs.comment == 'true' && github.event_name == 'pull_request'
      uses: marocchino/sticky-pull-request-comment@v2
      with:
        header: vigia
        path: vigia-report.md

    - name: Upload SARIF report to GitHub Code Scanning
      if: inputs.upload-sarif == 'true' && inputs.sarif == 'true'
      uses: github/codeql-action/upload-sarif@v3
      continue-on-error: true
      with:
        sarif_file: ${{ inputs.sarif-file }}
        category: ${{ inputs.category }}

    - name: Fail if there are P1 findings
      if: inputs.fail-on-p1 == 'true'
      shell: bash
      run: |
        LIST="${{ steps.files.outputs.list }}"
        SRC=""
        if [ -n "${{ inputs.source }}" ]; then SRC="--src ${{ inputs.source }}"; fi

        if [ -n "$LIST" ]; then
          node "${{ github.action_path }}/dist/cli.js" $SRC --files $LIST
        else
          node "${{ github.action_path }}/dist/cli.js" "${{ inputs.path }}" $SRC
        fi
